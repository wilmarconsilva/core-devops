# Overlay para VPS que NÃO compila (build feito na CI e publicado no GHCR).
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.registry.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.registry.yml up -d
#
# Vantagem: o VPS não precisa de SDK .NET/Node nem de RAM para build (build de .NET + Expo
# pede ~2 GB cada). Requer IMAGE_TAG e GHCR_OWNER no .env.
services:
  api:
    image: ghcr.io/${GHCR_OWNER}/core-api:${IMAGE_TAG:-latest}
    build: !reset null

  web-app:
    image: ghcr.io/${GHCR_OWNER}/core-web-app:${IMAGE_TAG:-latest}
    build: !reset null
