# Overlay para subir SEM domínio: teste local na sua máquina, ou VPS provisório
# ainda sem DNS configurado. Sem TLS — tudo em HTTP, em um único host:porta,
# roteado por caminho (ver Caddy/Caddyfile.without-domain).
#
# Uso:
#   cp .env.example .env
#   # ajuste ao menos POSTGRES_PASSWORD e JWT_SIGNING_KEY; API_DOMAIN/WEB_DOMAIN
#   # podem ficar com o valor de exemplo, não são usados neste overlay.
#   docker compose -f docker-compose.yml -f docker-compose.without-domain.yml up -d --build
#
# Acesso:
#   http://localhost/          (web)      — ou http://PUBLIC_HOST/ se definido no .env
#   http://localhost/api/...   (api)
#
# Deploy em VPS sem domínio: defina PUBLIC_HOST=<IP do VPS> no .env antes do build,
# para o front embutir a URL correta da API e o CORS liberar essa origem.
services:
  api:
    environment:
      Cors__Origins__0: "http://${PUBLIC_HOST:-localhost}"

      # O handle_path do Caddy remove o "/api" só na ida: a API enxerga /authentication/refresh,
      # mas o navegador continua vendo /api/authentication/refresh. Como o cookie é casado pelo
      # caminho que o NAVEGADOR conhece (RFC 6265: o Path precisa ser prefixo do caminho da
      # requisição), o path precisa incluir o prefixo — sem isso o cookie do refresh nunca é
      # enviado de volta e a sessão cai a cada F5, mesmo com a API saudável.
      #
      # O gatilho é a REESCRITA DE PREFIXO, não a ausência de TLS: o casamento de Path é textual,
      # e esquema/host/porta não entram nessa conta. O compose base dispensa esta variável porque
      # serve cada app na raiz do seu próprio subdomínio, e não porque usa HTTPS — se você migrar
      # o base para a alternativa de domínio único comentada no Caddy/Caddyfile, vai precisar
      # desta mesma linha lá, com TLS e tudo.
      Jwt__RefreshTokenCookiePath: "/api/authentication"

  web-app:
    build:
      args:
        EXPO_PUBLIC_WEB_SERVICE_URL: "http://${PUBLIC_HOST:-localhost}/api"

  proxy:
    volumes:
      - ./Caddy/Caddyfile.without-domain:/etc/caddy/Caddyfile:ro
