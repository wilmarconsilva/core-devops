# Stack completa do Core para VPS: PostgreSQL + API (.NET) + Web (PWA) + proxy reverso com TLS.
#
# Layout esperado no host (os contextos de build são relativos a este arquivo):
#   Core/
#     core-back-end/
#     core-front-end/
#     core-deploy/   <-- este arquivo
#
# Uso:
#   cp .env.example .env   (e preencha os valores)
#   docker compose up -d --build
name: core

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  # ============================================
  # Banco de dados
  # ============================================
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Sem "ports": o banco fica acessível apenas pela rede interna do Docker.
    # Para acessar de fora, use um túnel SSH (ver README).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - data
    logging: *default-logging

  # ============================================
  # API REST (.NET)
  # ============================================
  web-api-rest:
    build:
      context: ../core-back-end
      dockerfile: Docker/Dockerfile.Web.API.REST
    image: core-web-api-rest-tcc:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # A imagem usa ${PORT} no ENTRYPOINT (herança do Render) — precisa estar definido.
      PORT: 8080
      ASPNETCORE_ENVIRONMENT: Production

      # Configuração via variáveis de ambiente: "__" vira ":" na hierarquia do IConfiguration.
      # O Program.cs carrega o .env com NoClobber, então estas variáveis sempre prevalecem.
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};SSL Mode=Disable"

      Jwt__SigningKey: ${JWT__SIGNING_KEY}
      Jwt__Issuer: ${JWT__ISSUER:-Core.WebService}
      Jwt__Audience: ${JWT__AUDIENCE:-Core.Client}
      Jwt__AccessTokenExpirationMinutes: ${JWT__ACCESS_TOKEN_EXPIRATION_MINUTES:-30}
      Jwt__RefreshTokenExpirationDays: ${JWT__REFRESH_TOKEN_EXPIRATION_DAYS:-7}

      # CORS: arrays em variáveis de ambiente usam índice numérico (Cors:Origins[0]).
      Cors__Origins__0: "https://${WEB_APP_DOMAIN}"

      Email__Enabled: ${EMAIL__ENABLED:-false}
      Email__Host: ${EMAIL__HOST:-}
      Email__Port: ${EMAIL__PORT:-587}
      EMAIL__SENDER_EMAIL: ${EMAIL__SENDER_EMAIL:-}
      EMAIL__SENDER_NAME: ${EMAIL__SENDER_NAME:-Core}
      Email__Username: ${EMAIL__USERNAME:-}
      Email__Password: ${EMAIL__PASSWORD:-}
      EMAIL__ENABLE_SSL: ${EMAIL__ENABLE_SSL:-true}

      Swagger__Username: ${SWAGGER__USERNAME:-}
      Swagger__Password: ${SWAGGER__PASSWORD:-CHANGE-ME}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - data
      - edge
    logging: *default-logging

  # ============================================
  # Web (PWA estática servida por nginx)
  # ============================================
  web-app:
    build:
      context: ../core-front-end
      dockerfile: Docker/Dockerfile
      args:
        # Variáveis EXPO_PUBLIC_* são embutidas no bundle em tempo de BUILD.
        # Trocar o modo de operação exige rebuild da imagem — não basta reiniciar o container.
        EXPO_PUBLIC_OPERATION_MODE: ${EXPO_PUBLIC_OPERATION_MODE:-}
    image: core-web-app-tcc:local
    restart: unless-stopped
    environment:
      # Lida na INICIALIZAÇÃO do container (Docker/runtime-config.sh do front), não no build:
      # a mesma imagem serve qualquer ambiente. Trocar a URL exige só recriar o container
      # (docker compose up -d web-app). Sem ela, ou com valor inválido, o container não sobe.
      WEB_API_REST_URL: "https://${WEB_API_REST_DOMAIN:?defina WEB_API_REST_DOMAIN no .env}"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - edge
    logging: *default-logging

  # ============================================
  # Proxy reverso + TLS automático (Let's Encrypt)
  # ============================================
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web-api-rest:
        condition: service_healthy
      web-app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      WEB_API_REST_DOMAIN: ${WEB_API_REST_DOMAIN}
      WEB_APP_DOMAIN: ${WEB_APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # certificados — NÃO apagar (rate limit do Let's Encrypt)
      - caddy-config:/config
    networks:
      - edge
    logging: *default-logging

networks:
  # Rede de dados: apenas postgres e api.
  data:
  # Rede de borda: proxy, api e web-app.
  edge:

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
